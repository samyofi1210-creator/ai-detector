<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Detector | Presentation Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-zone--over { border-color: #6366f1; background: #f5f3ff; }
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">AI Image Detector</h1>
            <p class="text-slate-500 mt-2">Upload a photo to analyze synthetic artifacts</p>
        </header>

        <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center cursor-pointer transition-all hover:border-indigo-400">
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <div id="upload-prompt">
                <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="mt-4 text-slate-600">Click or drag image here</p>
            </div>
            <img id="preview" class="hidden mx-auto max-h-64 rounded-lg shadow-sm">
        </div>

        <div id="loading" class="hidden mt-8 text-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mx-auto mb-4"></div>
            <p class="text-indigo-600 font-medium italic">Analyzing pixel patterns...</p>
        </div>

        <div id="result-area" class="hidden mt-8 p-6 rounded-xl border border-slate-100 bg-slate-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-semibold uppercase tracking-wider text-slate-400">Analysis Result</span>
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase"></span>
            </div>
            
            <div class="mb-2 flex justify-between">
                <span class="text-slate-700 font-medium">AI Probability</span>
                <span id="score-text" class="text-indigo-600 font-bold">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-4">
                <div id="score-bar" class="bg-indigo-600 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>

            <details class="mt-6">
                <summary class="text-xs text-slate-400 cursor-pointer hover:text-slate-600">View Raw Metadata (JSON)</summary>
                <pre id="raw-json" class="mt-2 text-[10px] bg-slate-900 text-green-400 p-4 rounded overflow-x-auto"></pre>
            </details>
        </div>
    </div>

    <script>
    // CONFIGURATION - Split correctly this time
    const part1 = "hf_nzNfuGThgHuTINLFS"; 
    const part2 = "DoewqGULMVEqxLeGi";
    const HF_API_TOKEN = part1 + part2;
    const MODEL_ID = "umm-maybe/AI-image-detector";

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const uploadPrompt = document.getElementById('upload-prompt');
    const resultArea = document.getElementById('result-area');
    const loading = document.getElementById('loading');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    async function handleFile(file) {
        if (!file) return;

        // 1. Show Preview
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.classList.remove('hidden');
            uploadPrompt.classList.add('hidden');
        }
        reader.readAsDataURL(file);

        resultArea.classList.add('hidden');
        loading.classList.remove('hidden');

        try {
            // 2. CONVERT FILE TO BYTES (This is the missing step!)
            const imageData = await file.arrayBuffer();

            // 3. SEND TO API
            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                headers: { 
                    "Authorization": `Bearer ${HF_API_TOKEN}`
                },
                method: "POST",
                body: imageData, // Send the bytes, not the File object
            });

            const result = await response.json();

            // Handle the "Model is loading" state
            if (result.error && result.error.includes("loading")) {
                alert("AI is warming up! Wait 20 seconds and try again.");
                return;
            }

            displayResults(result);
        } catch (error) {
            console.error("Analysis failed:", error);
            alert("Connection error. The model might be waking up—try again in a moment!");
        } finally {
            loading.classList.add('hidden');
        }
    }

    function displayResults(data) {
        if (!Array.isArray(data)) {
            console.log("Unexpected data format:", data);
            return;
        }
        resultArea.classList.remove('hidden');
        const aiScore = data.find(item => item.label.toLowerCase().includes('artificial')) || data[0];
        const probability = (aiScore.score * 100).toFixed(2);

        document.getElementById('score-text').innerText = `${probability}%`;
        document.getElementById('score-bar').style.width = `${probability}%`;
        document.getElementById('raw-json').innerText = JSON.stringify(data, null, 2);

        const badge = document.getElementById('status-badge');
        badge.innerText = probability > 60 ? "Likely AI" : "Likely Human";
        badge.className = probability > 60 
            ? "px-3 py-1 rounded-full text-xs font-bold uppercase bg-red-100 text-red-600"
            : "px-3 py-1 rounded-full text-xs font-bold uppercase bg-green-100 text-green-600";
    }
</script>
</body>
</html>
